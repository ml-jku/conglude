[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ConGLUDe"
version = "0.2.0"
description = ""
authors = [
    {name = "Lisa Schneckenreiter", email = "schneckenreiter@ml.jku.at"}
]
readme = "README.md"
license = { text = "GNU General Public License v3.0" }
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26.0,<2.0",
    "scipy==1.13.0",
    "pandas==2.2.0",
    "pytorch-lightning>=2.5.3",
    "biopython==1.85",
    "lmdb==1.6.2",
    "einops==0.8.1",
    "statsmodels==0.14.4",
    "hydra-core==1.3.2",
    "hydra-colorlog==1.2.0",
    "transformers==4.51.0",
    "fair-esm==2.0.0",
    "wandb==0.21.1",
    "lifelines==0.30.0",
    "bottleneck==1.4.2",
    "joblib==1.5.3",
    "scikit-learn==1.8.0",
    ]


[tool.setuptools.packages.find]
include = ["conglude*"]